name: IndexNow ping

on:
  push:
    branches: [main]
    paths: ["content/blog/**"]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for deployment
        run: sleep 120
      - run: npm run indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: https://marketing.adithyareddy.online
